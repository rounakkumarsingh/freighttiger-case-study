[project]
name = "freightwatch"
version = "0.1.0"
description = "Flags unjustified freight cost creep and explains it from retrieved notes"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "chromadb>=0.5", "groq>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freightwatch = "freightwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freightwatch"]
